name: Security and core validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Every gate lives in scripts/test-all.mjs, so local runs and CI cannot drift apart.
      # The security surface audit runs first (against the Git index here) and gates the rest.
      - name: Run every validation gate
        run: node scripts/test-all.mjs
